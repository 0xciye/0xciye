name: Update recent projects

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Update projects in profile README
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const profileRepo = context.repo.repo;

            const { data: repositories } = await github.rest.repos.listForUser({
              username: owner,
              type: "owner",
              sort: "pushed",
              direction: "desc",
              per_page: 100,
            });

            const projects = repositories
              .filter((repo) =>
                repo.name.toLowerCase() !== profileRepo.toLowerCase() &&
                !repo.archived
              )
              .slice(0, 3);

            const clean = (text = "") =>
              text.replace(/\r?\n/g, " ").trim();

            const projectList = projects.length
              ? projects.map((repo) => {
                  const description = clean(repo.description);
                  const language = repo.language || "Mixed";
                  const fork = repo.fork ? " · `fork`" : "";
                  const summary = description ? ` — ${description}` : "";

                  return `- **[${repo.name}](${repo.html_url})**${summary} · \`${language}\`${fork}`;
                }).join("\n")
              : "_No public projects yet._";

            const { data: readme } = await github.rest.repos.getContent({
              owner,
              repo: profileRepo,
              path: "README.md",
            });

            if (Array.isArray(readme) || readme.type !== "file") {
              core.setFailed("README.md was not found as a file.");
              return;
            }

            const original = Buffer.from(readme.content, "base64").toString("utf8");
            const start = "<!-- PROJECTS:START -->";
            const end = "<!-- PROJECTS:END -->";

            if (!original.includes(start) || !original.includes(end)) {
              core.setFailed("Project markers are missing from README.md.");
              return;
            }

            const updated = original.replace(
              /<!-- PROJECTS:START -->[\s\S]*?<!-- PROJECTS:END -->/,
              `${start}\n${projectList}\n${end}`
            );

            if (updated === original) {
              core.info("Project list is already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo: profileRepo,
              path: "README.md",
              message: "docs: update recent projects",
              content: Buffer.from(updated, "utf8").toString("base64"),
              sha: readme.sha,
            });

            core.info(`Updated ${projects.length} recent project(s).`);
